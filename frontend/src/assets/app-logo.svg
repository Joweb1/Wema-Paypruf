<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth rich purple to vivid magenta/pink gradient -->
    <linearGradient id="payprufGrad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#3c096c" />
      <stop offset="25%" stop-color="#5a189a" />
      <stop offset="55%" stop-color="#7b2583" />
      <stop offset="80%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
  </defs>

  <!-- Triple-line slanted P logo matching app-logo.png -->
  <g fill="none" stroke="url(#payprufGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Track -->
    <path
      d="M 140 375 
         L 225 125 
         L 320 125 
         C 385 125, 415 170, 395 235 
         C 378 288, 325 315, 235 315 
         L 230 315"
      stroke-width="32"
    />

    <!-- Middle Track -->
    <path
      d="M 172 375 
         L 245 160 
         L 310 160 
         C 352 160, 372 190, 358 235 
         C 346 270, 310 285, 252 285 
         L 242 285"
      stroke-width="26"
    />

    <!-- Inner Track -->
    <path
      d="M 204 375 
         L 265 195 
         L 300 195 
         C 320 195, 330 210, 322 235 
         C 314 255, 292 258, 258 258"
      stroke-width="20"
    />
  </g>
</svg>
