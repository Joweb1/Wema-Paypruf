# render.yaml — PayPruf monorepo deployment on Render
# Both frontend and backend as Web Services (Docker) from same repo.
# Frontend uses nginx to serve the Vite/React build.
# Backend uses FastAPI + uvicorn + PostgreSQL.

services:
  # ============================================================
  # BACKEND: FastAPI Web Service
  # ============================================================
  - type: web
    name: paypruf-backend
    env: docker
    plan: free
    dockerfilePath: ./fastapi-backend/Dockerfile
    buildContext: .
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromService:
          type: db
          name: paypruf-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: paypruf-frontend
          property: url
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: paypruf-frontend
          property: url
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: paypruf-frontend
          property: url
      - key: API_V1_STR
        value: /api/v1
      - key: OCR_PROVIDER
        value: rapidocr
      - key: WEMA_PROVIDER_MODE
        value: mock
      - key: SECRET_KEY
        generate: true
      - key: JWT_SECRET
        generate: true
      - key: GEMINI_API_KEY
        value: ""
      - key: NVIDIA_API_KEY
        value: ""

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

  # ============================================================
  # FRONTEND: Docker + Nginx Web Service
  # Build: node build → nginx serve static files
  # ============================================================
  - type: web
    name: paypruf-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    buildContext: .
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: paypruf-backend
          property: url
      - key: OCR_PROVIDER
        value: rapidocr
      - key: WEMA_PROVIDER_MODE
        value: mock

    startCommand: nginx -g "daemon off;"

databases:
  - name: paypruf-db
    plan: free