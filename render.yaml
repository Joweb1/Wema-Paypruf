# render.yaml — PayPruf monorepo deployment on Render
services:
  # ============================================================
  # BACKEND: FastAPI Web Service
  # ============================================================
  - type: web
    name: paypruf-backend
    env: docker
    plan: free
    dockerfilePath: ./fastapi-backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # FIX: Use fromDatabase to link the PostgreSQL instance
      - key: DATABASE_URL
        fromDatabase:
          name: paypruf-db
          property: connectionString

      # FIX: Hardcode the frontend URLs since fromService doesn't support 'url'
      - key: FRONTEND_URL
        value: https://paypruf-frontend.onrender.com
      - key: PUBLIC_APP_URL
        value: https://paypruf-frontend.onrender.com
      - key: CORS_ORIGINS
        value: '["https://paypruf-frontend.onrender.com"]'

      - key: API_V1_STR
        value: /api/v1
      - key: OCR_PROVIDER
        value: rapidocr
      - key: WEMA_PROVIDER_MODE
        value: mock

      # FIX: Use generateValue instead of generate
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      - key: GEMINI_API_KEY
        value: ""
      - key: NVIDIA_API_KEY
        value: ""

  # ============================================================
  # FRONTEND: Docker + Nginx Web Service
  # ============================================================
  - type: web
    name: paypruf-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paypruf-backend.onrender.com/api/v1
      - key: OCR_PROVIDER
        value: rapidocr
      - key: WEMA_PROVIDER_MODE
        value: mock

databases:
  - name: paypruf-db
    plan: free